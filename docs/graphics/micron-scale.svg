<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" role="img" aria-labelledby="title desc">
  <title id="title">Fiber diameter bands (illustrative)</title>
  <desc id="desc">Approximate micron bands for cashmere, Super S cloth grades, merino apparel wool and coarser hair fibers. Educational only; IWTO Super limits and trade grades vary by document and date.</desc>
  <rect width="840" height="320" fill="#f7f4ef"/>
  <text x="32" y="36" font-family="Georgia, serif" font-size="22" fill="#1f2a24">Fiber diameter bands (illustrative)</text>
  <text x="32" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#5c6b63">Mean fiber diameter in microns (µm). Not a handfeel score. Super S values follow IWTO cloth labelling maxima, not farm classing tickets.</text>
  <line x1="80" y1="210" x2="780" y2="210" stroke="#1f2a24" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#1f2a24">
    <text x="80" y="228" text-anchor="middle">12</text>
    <text x="180" y="228" text-anchor="middle">15</text>
    <text x="280" y="228" text-anchor="middle">18</text>
    <text x="380" y="228" text-anchor="middle">21</text>
    <text x="480" y="228" text-anchor="middle">24</text>
    <text x="580" y="228" text-anchor="middle">27</text>
    <text x="680" y="228" text-anchor="middle">30</text>
    <text x="780" y="228" text-anchor="middle">36+</text>
  </g>
  <rect x="138" y="100" width="146" height="28" rx="4" fill="#c4a882" opacity="0.9"/>
  <text x="211" y="119" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2a24">Cashmere (typical trade)</text>
  <rect x="168" y="140" width="128" height="24" rx="4" fill="#8fa896"/>
  <text x="232" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1f2a24">Super 150s–100s cloth maxima</text>
  <rect x="168" y="172" width="292" height="24" rx="4" fill="#6d8f7b"/>
  <text x="314" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f7f4ef">Merino apparel range (broad)</text>
  <rect x="480" y="172" width="300" height="24" rx="4" fill="#8b7355"/>
  <text x="630" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f7f4ef">Coarser wool / hair fibers</text>
  <text x="32" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#5c6b63">Footnote: IWTO Super S cloth numbers are maximum mean diameters for labelled fabrics. Farm “superfine” classing bands are separate. Prickle risk rises as coarse-fiber content above ~30 µm increases.</text>
  <text x="32" y="292" font-family="system-ui, sans-serif" font-size="11" fill="#5c6b63">Bands are teaching ranges, not specifications for any lot. Check current IWTO / Woolmark documents for official tables.</text>
</svg>
