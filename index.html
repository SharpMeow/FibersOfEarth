title:"The Samoan art of siapo",url:"https://ocean.si.edu/human-connections/history-cultures/fibers-being-samoan-art-siapo",note:"Cultural context for living barkcloth traditions."},...["Sisal","Coir","Raffia","Horsehair","Llama","Acetate_fiber","Kapok"].map(e=>({id:"cameo-"+e.toLowerCase(),name:"Museum of Fine Arts, Boston",title:e.replaceAll("_"," "),url:"https://cameo.mfa.org/wiki/"+e,note:"Material-specific CAMEO reference."}))],Xn=[["abaca","Abac\xE1","Plant","Leaf-sheath fiber from Musa textilis, a relative of edible bananas. It is also called Manila hemp, although it is not hemp.","Strong, relatively coarse strands.","Cordage, specialty paper, woven craft textiles and composites.","Philippine abac\xE1 became an important maritime cordage material. Its later industrial story includes specialty papers and reinforcement rather than only rope.","jute"],["sisal","Sisal","Plant","A hard leaf fiber from Agave sisalana. Extraction separates long bundles from the fleshy leaf.","Stiff, strong and coarse.","Rugs, twine, cordage, brushes and composites.","An American agave fiber spread into international cultivation, including East Africa. Its history connects local plant use with large-scale cordage and agricultural twine.","cameo-sisal"],["coir","Coir","Plant","Fiber separated from the husk of the coconut. Brown and white coir refer to different maturity and processing contexts.","Coarse, springy and durable.","Doormats, brushes, upholstery filling, erosion-control products and growing media.","Coconut-fiber rope and matting have a long history around the Indian Ocean. Modern uses broadened into horticulture and geotextiles.","cameo-coir"],["kenaf","Kenaf","Plant","Bast fiber from Hibiscus cannabinus, with a woody core that can have separate uses.","Coarse plant fiber, often used for structure.","Cordage, pulp, nonwovens and composite reinforcement.","Kenaf entered commerce alongside other jute-like bast fibers. Industrial interest later extended to pulp, panels and composite products.","jute"],["kapok","Kapok","Plant","Light seed floss from the kapok tree, commonly Ceiba pentandra. It is usually a filling material rather than a straightforward spinning fiber.","Very light, smooth and fluffy.","Cushion filling, insulation and specialized blends.","Kapok was used in upholstery and buoyant fillings before synthetic foams expanded. Its short, smooth structure has historically limited conventional spinning.","cameo-kapok"],["nettle","Nettle","Plant","Bast fiber from nettle species. Species, growing region and extraction method should be named.","Linen-like character, varying with preparation.","Craft yarn, specialty cloth and blends.","Nettle belongs to a long tradition of gathering and processing stem fibers. Contemporary small-scale textile work revisits those skills and adapts them to modern yarn preparation.","cameo"],["banana","Banana fiber","Plant","Fiber extracted from banana pseudostems or leaf sheaths. It should not be confused with abac\xE1 simply because both are Musa plants.","From coarse strands to softer processed blends.","Handmade textiles, paper, cordage and composites.","Banana-family plant fibers appear in several regional craft traditions. Recent material projects often emphasize using agricultural residues, but processing and blends differ.","cameo"],["pineapple","Pineapple leaf fiber","Plant","Leaf fiber from the pineapple plant. Traditional pi\xF1a cloth and modern coated leaf-fiber composites are different product forms.","Fine extracted fibers can form light, crisp cloth.","Pi\xF1a textiles, specialty blends and composite sheets.","Philippine pi\xF1a weaving developed a distinctive fine-cloth tradition. Modern leaf-fiber products also include nonwoven and coated composites that should be described separately.","cameo"],["bamboo-bast","Bamboo bast","Plant","Mechanically separated bamboo fiber, distinct from viscose made using bamboo-derived pulp.","Texture depends strongly on separation and softening.","Specialty yarns, craft textiles and reinforcement.","Bamboo has long been used in split and woven structures. Mechanically extracted textile fiber is a different route from the much more familiar regenerated bamboo rayon.","cameo"],["raffia","Raffia","Plant","Strips and fibers from raffia palm leaves. Natural raffia is different from plastic ribbon sold under similar names.","Flexible, ribbon-like and textured.","Baskets, hats, mats, bags and decorative textiles.","Raffia is rooted in African and Malagasy textile and basketry traditions. Its leaves can be split and joined rather than spun like cotton.","cameo-raffia"],["paper-yarn","Paper yarn","Plant","Narrow paper strips twisted into yarn. The original paper pulp may come from different plants.","Light and structured; finish-dependent.","Woven textiles, hats, craft work and specialty cloth.","Paper yarn is associated with traditions including Japanese shifu. It transforms an existing sheet into a textile element, showing that fiber and yarn need not follow one route.","cameo"],["barkcloth","Barkcloth","Plant","A sheet formed from prepared inner bark, usually by beating and joining rather than conventional spinning and weaving.","Supple or papery depending on preparation.","Ceremonial cloth, clothing traditions and art.","Pacific barkcloth traditions, including Samoan siapo, carry living cultural knowledge. Their histories should be connected to particular communities, not reduced to a single global origin.","bark-history"],["lotus","Lotus fiber","Plant","Fine strands drawn from lotus stems and joined for specialty yarn. Verify actual composition in products using the name.","Delicate and textured.","Small-scale woven scarves and specialty textiles.","Lotus-stem yarn is associated with specialized regional craft practices in Asia. Modern luxury interest does not establish the provenance of every product carrying the name.","cameo"],["milkweed","Milkweed floss","Plant","Seed floss from milkweed plants. It functions more readily as filling than as a conventional long spinning fiber.","Light, fine and fluffy.","Fillings, experimental blends and insulation.","Milkweed floss has been explored as a buoyant filling and an alternative plant fiber. Its short, smooth structure shapes both its opportunities and spinning limitations.","cameo"],["henequen","Henequen","Plant","A hard leaf fiber from Agave fourcroydes, related to but distinct from sisal.","Stiff, strong bundles.","Twine, rope, rugs and craft products.","Henequen is closely associated with Yucat\xE1n cordage production. Its plantation history and local labor history are important parts of the material story.","cameo-sisal"],["llama","Llama","Animal","Fleece from Lama glama, with fine and coarse fractions that may need separation.","Ranges from soft down to strong outer hair.","Knitwear, blankets, rugs and cordage.","Llamas have long combined pack-animal and fiber roles in the Andes. Different parts of the fleece serve different textile purposes.","cameo-llama"],["bison","Bison down","Animal","Fine undercoat recovered from bison and separated from coarse hair.","Soft, warm down after preparation.","Small-scale yarns, accessories and blends.","Bison materials are part of Indigenous North American histories. Modern down yarn is a specialized product and should not be treated as a uniform account of those varied traditions.","cameo"],["possum","Possum fiber","Animal","Underfur used in specialty blends, particularly with wool. Species and sourcing context matter.","Soft and lofty in blends.","Knitwear and accessories.","Possum-fiber blends developed a recognizable niche in New Zealand knitwear. Claims about conservation benefit require evidence about the specific supply and collection system.","cameo"],["rabbit","Rabbit hair","Animal","Rabbit hair from breeds other than, or not identified as, Angora. It is not automatically equivalent to angora down.","Variable; often used in felt or blends.","Felt, hats, blends and specialty yarn.","Rabbit hair has a long place in felt making. The distinction between a pelt, loose hair and a specialty down yarn is essential to understanding its history.","fao"],["horsehair","Horsehair","Animal","Coarse mane or tail hair used for resilience and structure rather than softness.","Springy, firm and strong.","Upholstery, tailoring interlinings, brushes and decorative work.","Horsehair cloth supported tailoring and millinery, while shorter curled hair filled furniture. Many modern products named horsehair braid are actually synthetic.","cameo-horsehair"],["chiengora","Chiengora","Animal","A term for yarn spun from dog undercoat, usually in small-scale craft contexts.","Variable by coat; often warm with a halo.","Keepsake yarn, hand knits and blends.","Spinning canine hair has occurred in distinct craft traditions. Modern pet-undercoat yarn should not be conflated with the specific histories of Indigenous woolly-dog textiles.","cameo"],["down","Down","Animal","Soft branching plumage clusters, commonly from ducks or geese. Down is a filling, not a spun fiber in ordinary apparel.","Lofty and insulating as filling.","Jackets, sleeping bags, duvets and pillows.","Down became a familiar filling because its clusters trap air. Modern product descriptions distinguish species, fill composition and measured loft, alongside welfare and traceability.","standards"],["feather","Feather","Animal","Bird plumage with a more defined shaft than down. Often blended into fillings or used decoratively.","Resilient, with a noticeable quill structure.","Cushions, bedding, decoration and specialty materials.","Feathers have many cultural and functional uses, from adornment to bedding. Their history is broader than the modern commodity filling market.","cameo"],["eri-silk","Eri silk","Animal","Silk associated with eri silkworms, commonly prepared as spun staple rather than a continuous reeled filament.","Matte, soft and more wool-like than smooth reeled silk.","Shawls, spun yarn and woven cloth.","Eri silk is closely linked with northeastern Indian textile traditions. Ethical claims about harvesting must be verified for the actual process and cannot be inferred from the fiber name alone.","fao"],["tussar-silk","Tussar silk","Animal","A group of non-mulberry silks, with species and geography affecting the finished fiber.","Often textured with natural golden or brown tones.","Saris, scarves, furnishing cloth and blends.","Tussar connects silk production to different host plants and regional knowledge than mulberry sericulture. Its trade name covers variation rather than a single standardized hand.","fao"],["muga-silk","Muga silk","Animal","A silk associated with Assam and the muga silkworm. Distinct origin and species claims deserve documentation.","Known for a natural golden character.","Traditional dress, fine woven cloth and accessories.","Muga holds a particular place in Assamese textile heritage. Modern provenance claims should preserve that geographic specificity instead of treating the name as merely a color.","fao"],["acetate","Acetate","Cellulosic","A cellulose derivative, usually cellulose diacetate, spun into fiber. It differs chemically from regenerated cellulose such as viscose.","Smooth, lustrous and draping.","Linings, dresses, ribbons and furnishing fabrics.","Cellulose acetate developed into a commercial artificial-silk textile during the early twentieth century. It later gained a distinct fiber identity apart from rayon.","cameo-acetate_fiber"],["triacetate","Triacetate","Cellulosic","A more highly acetylated cellulose derivative than ordinary acetate.","Smooth with useful pleat and shape retention in suitable fabrics.","Pleated garments, dresses and linings.","Triacetate belongs to the twentieth-century development of cellulose-derived manufactured fibers. Its distinction from diacetate matters for processing and care.","cameo-acetate_fiber"],["cupro","Cupro","Cellulosic","Regenerated cellulose made by a cuprammonium process, often using cotton linters as feedstock.","Fine, smooth and fluid.","Linings, dresses and delicate woven fabrics.","Cupro belongs to the early family of artificial-silk processes. Its later use in fine linings reflects the ability to produce smooth cellulose filaments.","manufactured"],["azlon","Azlon / protein fiber","Regenerated protein","Manufactured fiber formed from regenerated protein, historically including casein, soy and other sources.","Variable; often intended to resemble soft animal fibers.","Historical textiles, specialty yarn and experimental blends.","Protein-based artificial fibers were explored in the twentieth century, including during periods of raw-material constraint. A modern milk- or soy-named yarn may contain other polymers or fibers.","manufactured"],["alginate","Alginate","Bio-based","Fiber formed from alginic-acid derivatives associated with brown seaweed. Product chemistry and additives vary.","Functional fiber whose properties depend on formulation.","Specialty nonwovens, technical textiles and temporary textile components.","Alginate moved from marine polysaccharide chemistry into specialized fiber applications. It is usually discussed through a particular technical function rather than a general apparel category.","manufactured"],["pla","PLA","Bio-based","Polylactic acid, a manufactured polymer that can use fermentation-derived feedstocks. Bio-based and biodegradable are different claims.","Light, with performance depending on grade and construction.","Nonwovens, fillings, specialty apparel and packaging textiles.","PLA fiber reflects the development of industrial polymers from biological feedstocks. End-of-life claims depend on defined conditions and available facilities.","cameo"],["polypropylene","Polypropylene","Synthetic","An olefin polymer melt-spun into fibers or tapes.","Very light, with low moisture absorption.","Nonwovens, carpets, thermal base layers, ropes and geotextiles.","Polypropylene fibers expanded with twentieth-century polyolefin chemistry. Their lightweight structure and processability made them useful far beyond apparel.","manufactured"],["polyethylene","Polyethylene / UHMWPE","Technical","Polyethylene fibers include high-performance ultra-high-molecular-weight grades. Generic polyethylene and specialized UHMWPE yarn are not interchangeable.","Light and potentially very strong in engineered grades.","Ropes, protective textiles, reinforcement and technical products.","High-performance polyethylene yarn developed from advances in polymer preparation and drawing. Brand names often identify particular grades rather than a separate chemical family.","manufactured"],["para-aramid","Para-aramid","Technical","An aromatic polyamide engineered for high tensile performance. Brand names include particular para-aramid products.","Strong, low-stretch technical fiber.","Reinforcement, protective equipment, ropes and composites.","Para-aramid emerged from twentieth-century high-performance polymer research. Kevlar is a familiar brand example, not the generic name for every aramid.","manufactured"],["meta-aramid","Meta-aramid","Technical","An aromatic polyamide with a different molecular arrangement from para-aramid, used for thermal performance.","Technical fiber chosen for heat-related applications.","Protective garments, filtration and electrical insulation.","Meta-aramids expanded the use of synthetic fibers in demanding thermal environments. Protection depends on a tested fabric or system, not the fiber name alone.","manufactured"],["modacrylic","Modacrylic","Synthetic","A modified acrylonitrile-based fiber category, chemically distinct from ordinary acrylic.","Soft and versatile, including pile structures.","Faux fur, wigs, pile fabrics and protective blends.","Modacrylic developed alongside other mid-twentieth-century manufactured fibers. Its composition enabled textile roles different from conventional acrylic sweater yarn.","manufactured"],["pva","PVA / vinal","Synthetic","Polyvinyl alcohol-based fibers with properties controlled by polymer treatment and processing. Some types are water-soluble; others are not.","Variable technical or staple fiber.","Temporary yarns, reinforcement, specialty textiles and industrial uses.","PVA-derived fibers diversified into soluble processing aids and more durable fiber forms. The grade name is essential to understanding behavior.","manufactured"],["pvc","PVC / vinyon","Synthetic","Chlorinated vinyl-polymer fibers. A PVC-coated fabric is a separate construction and may have a different underlying fiber.","Grade-dependent synthetic fiber.","Historical specialty textiles and technical applications.","Vinyon belongs to an earlier generation of manufactured fiber categories. Its history should be distinguished from the much broader use of PVC coatings.","manufactured"],["ptfe","PTFE fiber","Technical","Polytetrafluoroethylene formed into fibers or related textile structures. A membrane is not necessarily a spun fiber.","Low-friction technical material.","Filtration, industrial textiles and specialized components.","PTFE entered textile engineering through chemical resistance and low-friction applications. Product form, additives and manufacturing history matter more than a broad fluoropolymer label.","cameo"],["pps","PPS fiber","Technical","Polyphenylene sulfide engineered for demanding industrial environments.","Functional technical staple or filament.","Industrial filtration and heat-resistant textile systems.","PPS fibers grew from engineering-polymer development and industrial filtration needs. Their performance should be assessed from the particular grade and application specification.","cameo"],["pbi","PBI fiber","Technical","Polybenzimidazole, an engineered high-temperature fiber commonly used within protective textile systems.","Specialized technical fiber, often blended.","Protective clothing and industrial applications.","PBI belongs to the development of high-temperature polymers for demanding uses. A garment\u2019s actual certification and construction govern its protective claims.","cameo"],["carbon","Carbon fiber","Technical","Carbon-rich filaments produced from a precursor such as PAN or pitch and usually used in a composite system.","Stiff reinforcement rather than ordinary apparel softness.","Composites, sporting goods, vehicles and structural reinforcement.","Modern carbon fiber grew through research into high-performance reinforcement. The textile architecture and resin are as important as the filament to the final composite.","cameo"],["glass","Glass fiber","Mineral & metal","Drawn inorganic glass filaments, available in multiple compositions and product forms.","Strong reinforcement with limited flexibility at sharp bends.","Composites, industrial fabrics, insulation and technical textiles.","Glass was drawn into fine filaments before becoming a major industrial reinforcement. Modern continuous-filament fabrics differ from loose insulation wool.","manufactured"],["basalt","Basalt fiber","Mineral & metal","Continuous or discontinuous mineral fiber formed from processed basalt rock.","Technical reinforcement.","Composites, industrial fabrics and insulation systems.","Basalt fiber is part of the development of mineral-based technical reinforcement. It should be evaluated as a processed material, not simply as untouched rock.","cameo"],["metal","Metal fiber","Mineral & metal","Fine metallic filaments, shaved fibers or metal-containing yarn structures. Coated plastic metallic yarn is a different construction.","Can be conductive, reflective or structurally stiff.","Conductive textiles, shielding, decoration and filtration.","Metal threads appear in historic luxury textiles; modern metal fibers also serve electrical and industrial functions. The metal, substrate and construction should be named.","cameo"],["ceramic","Ceramic fiber","Mineral & metal","A broad group of inorganic technical fibers, with composition and respirability varying widely.","Functional high-temperature material.","Industrial thermal insulation and composite reinforcement.","Ceramic fibers developed for environments beyond the practical range of ordinary organic textile fibers. Their specific chemistry and handling guidance cannot be generalized.","cameo"],["asbestos","Asbestos (historical)","Mineral & metal","A group of naturally fibrous silicate minerals historically used in technical textiles. Included only as historical material context.","Historical heat-resistant mineral fiber.","Historical insulation, fire-resistant cloth and industrial products.","Asbestos was once woven into heat-resistant products. Its serious inhalation hazards transformed how legacy materials are managed; suspected material should not be disturbed and needs qualified assessment.","cameo"],["recycled-cotton","Recycled cotton","Recycled","Cotton recovered from production scraps or used textiles and reopened for another textile cycle.","Input-dependent, often blended for strength.","Denim, knitwear, wiping cloth, insulation and blends.","Recovering cotton textiles predates modern circular-fashion language. Current systems differ in input sorting, color separation and retained fiber length.","standards"],["recycled-nylon","Recycled nylon","Recycled","Polyamide recovered through a recycling route from a specified waste stream. The original polymer and recovery method matter.","Can serve similar functions to virgin grades.","Swimwear, hosiery, carpets, bags and technical textiles.","Modern nylon recovery includes production waste and selected used-product streams. A take-back story is meaningful only when the actual input and downstream processing are documented.","standards"]],Lt=Object.fromEntries(Xn.map(([e,a,t,n,i,r,o,s])=>[e,{id:e,name:a,family:t,composition:n,feel:i,uses:r,history:o,tagline:n.split(". ")[0]+".",sources:[s],legacyOnly:!1,referenceOnly:!0,care:t==="Technical"||t==="Mineral & metal"?"Use the manufacturer\u2019s application-specific maintenance and handling instructions. Technical performance cannot be inferred from household laundry guidance.":"Follow the complete product\u2019s care label. Blends, dyes, finishes and construction can change suitable washing, drying and storage.",tradeoff:t==="Technical"||t==="Mineral & metal"?"Evaluate the specified grade, whole product, useful lifetime and realistic recovery route. A technical property does not establish a lower overall impact.":"Origin, processing inputs, labor, product construction and useful lifetime all need specific evidence. The name alone does not establish responsible production.",question:"What exact material, product form and documented producer stand behind this name?"}])),qt={wool:"Sheep fleece moved from household spinning and regional cloth trades into mechanized woollen and worsted industries. Merino became associated with fine apparel wool, while Australia became an important growing region. Modern wool spans tailoring, performance layers and interior textiles.",cotton:"Cotton has deep textile histories in Asia and the Americas. Indian cotton cloth played a major role in international trade; mechanized mills later transformed production. Its industrial history is also inseparable from plantation slavery and colonial labor systems.",linen:"Flax is among the long-established plant sources of cloth. Linen moved through household, commercial and mechanized production, with a strong European growing and processing tradition. Today it appears in both woven and knitted fabrics.",cashmere:"Fine goat down is associated with the history of Kashmir shawls, although the raw material and finished cloth have not always shared an origin. Industrial dehairing and spinning later connected pastoral regions to international knitwear production.",silk:"Silk production has a long history in China and later spread through interconnected Asian, Middle Eastern and European textile cultures. Trade carried both cloth and design ideas. Modern sericulture and weaving still encompass many distinct traditions.",alpaca:"Alpaca fiber belongs to a long Andean history of camelid husbandry and textile making. Modern sorting, spinning and export connect those landscapes with industrial and craft markets. Fiber grade and community context remain essential.",mohair:"The Angora goat connects mohair\u2019s name to Ankara and its surrounding history. Breeding and trade later established important production outside Turkey, including southern Africa. Mohair now appears in both smooth tailoring and brushed knitwear.",yak:"Yak coats have supported textile use in high-plateau pastoral communities. Fine down and coarse outer hair serve different purposes. Contemporary luxury yarn markets emphasize the dehaired undercoat, one part of a broader material tradition.",angora:"Angora rabbits developed a place in specialist animal-fiber husbandry and later commercial knitwear. Their fine, fluffy hair is often blended to create a visible halo. Collection and welfare practices require their own evidence.",vicuna:"Vicu\xF1a fiber has a long Andean prestige history. Conservation and managed harvesting are central to its modern story. A luxury label alone does not establish the origin or legality of a particular item.",camel:"Camel hair has long served pastoral textile needs, with fine down and coarse hair used differently. Industrial coating fabrics made the material widely recognizable, although camel-colored cloth is not necessarily made from camel hair.",guanaco:"Guanaco is part of South American camelid textile history. Its relationship to wild populations makes modern collection and provenance especially important. This atlas treats the inherited international route as a research model.",qiviut:"Musk ox underwool belongs to northern material traditions and modern specialist fiber work. The Musk Ox Farm in Palmer provides a documented example of gentle farm combing. That example should not be generalized to all qiviut supply.",hemp:"Hemp developed a long history in rope, canvas and other strong textiles. Contemporary apparel uses both long-fiber preparation and cottonized blends. The current interest in hemp brings old processing questions into new product categories.",jute:"Jute became closely associated with packaging, sacks and industrial cloth. Delta agriculture and mill production shaped its commodity history. Newer products include geotextiles and composites alongside familiar hessian.",polyester:"Polyester expanded with twentieth-century synthetic polymer technology and mass textile production. It became important in apparel and home textiles, then in fleece and performance fabrics. The current story includes both virgin feedstocks and distinct recycling routes.",nylon:"Nylon emerged from Wallace Carothers\u2019 polymer research at DuPont. Commercial production began in 1939. Its early consumer and wartime uses led into a broad family of apparel and technical polyamide textiles.",spandex:"Elastane grew out of twentieth-century polyurethane fiber development. Small blend percentages made stretch and recovery possible across fitted clothing, sportswear and denim. The same blend structure can complicate later fiber separation.",acrylic:"Acrylic developed as part of the mid-twentieth-century expansion of manufactured fibers. Its wool-like bulk suited affordable knitwear and blankets. Yarn structure and finishing produce many different surfaces under the same generic name.",viscose:"Viscose belongs to the early development of manufactured cellulose fibers, initially associated with artificial silk. It later became a major staple and filament category. Process chemistry and plant-level recovery remain important distinctions.",lyocell:"Lyocell became commercially established later than viscose and modal, using direct solvent dissolution. Its development reflects efforts to refine cellulose-fiber processing. A generic lyocell name does not establish one producer\u2019s exact recovery performance.",modal:"Modal developed within the regenerated-cellulose family to improve particular mechanical properties, especially when wet. It became familiar in smooth knits and next-to-skin blends. It is a generic fiber category, separate from brand names.",ramie:"Ramie has a long association with East Asian plant-fiber textiles and is also known as China grass. Its strength and luster encouraged textile use, while removing natural gums remained an important processing step.","recycled-wool":"Recovering wool from existing cloth is older than contemporary circular-fashion language. Mechanical opening and color sorting allow another textile use, often with blending to address shorter fibers. The input history should remain visible.","recycled-polyester":"Polyester recycling expanded through recovery of PET products, particularly bottles. Textile-to-textile recovery is a separate challenge. Modern recycled-content claims need to distinguish the input waste stream and the recycled share.",mink:"Mink\u2019s commercial history primarily concerns pelts and fur garments. The original atlas grouped it with fibers; this edition retains it in a clearly separated specialty archive. Current trade links and welfare claims have not been validated here.",fox:"Fox fur belongs to the history of pelts, garments and trim rather than a single standardized spinning fiber. This edition preserves the original concept in the specialty archive without asserting that its modeled trade routes are current.",tanuki:"Raccoon dog fur has circulated under several trade names. Accurate species identification is essential to its textile history and contemporary labeling. The inherited route model remains unverified.",yangir:"Yangir appears as a specialty ibex-down trade term in the original project. Independently verified historical milestones and commercial relationships were not established in this edition, so no origin date or performance ranking is invented.",cervelt:"Cervelt appears as a proprietary red-deer-down name in the original project. Its specific commercial timeline requires producer documentation. This edition preserves the entry while leaving unsupported dates and volume claims out."},jt={wool:"merino sheep lambswool shetland bluefaced leicester corriedale cashwool",cotton:"pima supima egyptian sea island organic upland gossypium",linen:"flax linum",cashmere:"pashmina capra",silk:"mulberry bombyx mori",viscose:"rayon bamboo rayon bamboo viscose",lyocell:"tencel eucalyptus",modal:"tencel modal",nylon:"polyamide perlon",spandex:"spandex elastane lycra",polyester:"pet dacron terylene","para-aramid":"kevlar twaron","meta-aramid":"nomex",polyethylene:"dyneema spectra uhmwpe",azlon:"milk casein soy soybean protein",cupro:"bemberg cuprammonium",abaca:"manila hemp",tanuki:"raccoon dog",ramie:"china grass",ptfe:"teflon",metal:"stainless steel copper silver metallic",cottonization:"cottonised cottonized"};var zt=[["tencel","TENCEL\u2122","Branded fiber family","lyocell","Lenzing\u2019s brand includes lyocell and modal products. Read the generic composition to identify which fiber is present.","The brand\u2019s history follows the commercial development and branding of regenerated cellulose. Its portfolio spans more than one generic fiber type.","https://www.lenzing.com/technology-production/technologies/"],["ecovero","LENZING\u2122 ECOVERO\u2122","Branded viscose","viscose","A Lenzing viscose brand with producer-specific sourcing and process claims. Those claims should be checked for the particular product.","The brand developed around differentiated viscose sourcing and production. Its range later incorporated products using REFIBRA technology.","https://www.lenzing.com/products/brands/lenzingtm-ecoverotm/"],["refibra","REFIBRA\u2122","Feedstock technology","lyocell","Lenzing technology that incorporates recovered cellulose inputs into selected fiber products. The actual recycled share depends on the product.","REFIBRA has been associated with TENCEL lyocell and was extended to ECOVERO viscose. It identifies a technology rather than a separate generic fiber.","https://www.lenzing.com/newsroom/news-events/lenzing-expands-refibratm-technology-to-lenzingtm-ecoverotm-setting-new-responsible-viscose-standards-for-textile-circularity/"],["econyl","ECONYL\xAE","Regenerated nylon brand","recycled-nylon","Aquafil\u2019s regenerated nylon brand. Identify the product, composition and documented waste inputs rather than assuming all feedstock is fishing nets.","The brand connects nylon recovery with new yarn and product applications. It is a branded route within polyamide recycling, not a new natural fiber.","https://econyl.aquafil.com/"],["repreve","REPREVE\xAE","Recycled-material platform","recycled-polyester","UNIFI\u2019s brand spans recycled polyester, nylon and related products. Waste streams and product specifications vary within the platform.","REPREVE expanded from recycled-fiber branding into multiple feedstock and product lines. FiberPrint and U-TRUST are associated traceability tools.","https://repreve.com/"],["seaqual","SEAQUAL\xAE YARN","Recycled-yarn program","recycled-polyester","A yarn program associated with recovered marine plastic. Check the exact composition and marine-derived share of the specified yarn.","SEAQUAL connects collection and polymer processing with yarn partners. The program name does not describe the entire composition of every finished fabric.","https://www.seaqual.org/seaqual-yarn/"],["spinnova","SPINNOVA\xAE","Fiber technology","paper-yarn","A proprietary fiber-forming technology and ingredient brand using cellulose-rich inputs. It is distinct from ordinary viscose processing.","Spinnova\u2019s development centers on turning a cellulose suspension into textile fiber. Commercial status and manufacturing capacity should be checked with the producer.","https://spinnova.com/fibre/"],["infinna","Infinna\u2122","Regenerated fiber brand","viscose","Infinited Fiber Company\u2019s branded cellulose fiber made using its proprietary technology and
