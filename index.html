<body><a class="skip" href="#main">Skip to content</a><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="search-dialog" aria-labelledby="search-title"></dialog><noscript><main><h1>Fibers of Earth</h1><p>This interactive atlas requires JavaScript. Enable JavaScript to explore the material library and maps, or <a href="glossary/index.html">read the textile glossary without JavaScript</a>.</p></main></noscript><script>(()=>{var Et=[{id:"woolmark",name:"The Woolmark Company",title:"Wool processing",url:"https://www.woolmark.com/industry/use-wool/wool-processing/",note:"Technical reference for scouring, carding, combing, spinning and fabric formation."},{id:"flax",name:"Alliance for European Flax-Linen & Hemp",title:"All about European flax",url:"https://allianceflaxlinenhemp.eu/en/all-about-european-linen",note:"Industry reference for flax geography, fiber extraction and linen terminology."},{id:"lenzing",name:"Lenzing",title:"Fiber production technologies",url:"https://www.lenzing.com/technology-production/technologies/",note:"Producer explanation of lyocell, viscose and modal. Its process claims describe its own operations."},{id:"exchange",name:"Textile Exchange",title:"Materials Market Report 2025",url:"https://textileexchange.org/knowledge-center/reports/materials-market-report-2025/",note:"2024 global production data, published September 2025. This is a dated snapshot, not a live counter."},{id:"standards",name:"Textile Exchange",title:"Material standards",url:"https://textileexchange.org/standards/",note:"Official entry point for scope, claims and current versions of material standards."},{id:"sfa",name:"Sustainable Fibre Alliance",title:"Standards and resources",url:"https://sustainablefibre.org/resources/",note:"Cashmere sourcing, primary processing and chain-of-custody reference."},{id:"fao",name:"Food and Agriculture Organization",title:"Harvesting of textile animal fibres",url:"https://www.fao.org/4/v9384e/v9384e00.htm",note:"Historical technical reference. Not used as a source of current market shares or trade flows."},{id:"jute",name:"Food and Agriculture Organization",title:"Jute and hard fibres",url:"https://www.fao.org/markets-and-trade/commodities-overview/fibres/jute-and-hard-fibres/",note:"Commodity background and end-use reference."},{id:"ramie",name:"Food and Agriculture Organization",title:"Boehmeria nivea crop profile",url:"https://ecocrop.apps.fao.org/ecocrop/srv/en/cropView?id=3746",note:"Botanical and agricultural reference for ramie."},{id:"qiviut",name:"Musk Ox Farm",title:"Qiviut in Palmer, Alaska",url:"https://www.muskoxfarm.org/",note:"A specific example of musk ox husbandry and hand-combed qiviut, not proof of every Arctic route."},{id:"cites",name:"CITES",title:"Vicu\xF1a and international trade",url:"https://cites.org/eng",note:"Consult current species listings and national authorities for actual trade requirements."},{id:"map",name:"Natural Earth / World Atlas",title:"World map geometry",url:"https://github.com/topojson/world-atlas",note:"Bundled generalized map data. City markers are approximate and do not identify suppliers."}],Yn={wool:["Merino wool","Animal","From open pasture to considered cloth.","Keratin from sheep fleece. Merino describes a sheep breed and its wool, rather than a fabric construction.","Springy, insulating, with a soft hand in finer grades.","Knitwear, tailoring, base layers and blankets.","Follow the label. Air between wears; use a wool cycle only if permitted, avoid agitation and dry knitwear flat.","Farming, land management, processing energy and garment longevity all matter. A natural origin alone is not an impact assessment.","Can the seller identify the wool origin, mill, fiber grade and scope of any animal-welfare certification?",["woolmark","standards"]],cashmere:["Cashmere","Animal","A winter undercoat, a long spring journey.","The fine undercoat of cashmere goats, separated from coarser guard hairs.","Soft and lofty, with warmth at a relatively light weight.","Sweaters, scarves, lightweight coating and accessories.","Wash only as the care label allows. Minimize rubbing, reshape gently and dry flat. Remove pills carefully.","Rangeland condition, herd management and dehairing practices deserve attention alongside the finished hand.","What evidence connects this garment to its herding region and processing chain?",["sfa","fao"]],linen:["Linen","Plant","A field of flax, woven into summer.","Bast fiber extracted from flax stems. Linen is the textile fiber name; flax is the plant.","Crisp, absorbent and characteristically creased; softens with use.","Shirting, summer tailoring, table linen and bedding.","Follow the label, allow space in the wash and reshape while damp. Creasing is part of its character.","Cultivation conditions and retting methods vary. Dyeing, finishing and fabric construction also shape the final footprint.","Where was the flax grown, and where were spinning, weaving and finishing performed?",["flax"]],cotton:["Cotton","Plant","A seed fiber with a world of possibilities.","Cellulose hairs growing around the seeds of the cotton plant, separated at ginning.","Absorbent and versatile; the feel depends strongly on yarn and weave.","T-shirts, denim, shirts, towels and bedding.","Follow the care label and separate colors. Excess heat can shrink some cotton fabrics and weaken finishes.","Irrigation needs depend on place and season. Farming inputs, labor conditions and wet processing need specific evidence.","Which growing region and chain-of-custody evidence support the cotton claim?",["exchange","standards"]],silk:["Silk","Animal","A continuous filament, a luminous cloth.","Protein filament formed by silkworms in cocoons. Cultivated mulberry silk is one important type.","Smooth with characteristic luster and fluid drape.","Scarves, dresses, ties, linings and decorative textiles.","Check the label before washing. Avoid wringing, harsh detergents and prolonged direct sun; test colorfastness.","Sericulture, cocoon processing and finishing practices vary. Silk does not imply a single animal-welfare method.","Is the producer able to explain the silk type, cocoon process and dyeing location?",["fao"]],alpaca:["Alpaca","Animal","The Andes, carried in a fleece.","Hair from alpacas. Huacaya and Suri fleeces have different structures and textile effects.","Warm with a soft or silky handle depending on grade and construction.","Knitwear, scarves, blankets and coating fabrics.","Use the garment label, support wet knits and dry flat. Store clean and protect from textile pests.","Fiber grading and sorting matter as much as origin. Animal care and producer livelihoods need separate attention.","What grade was used, and how are farms and processors identified?",["fao","standards"]],mohair:["Mohair","Animal","Luster from the Angora goat.","Hair from Angora goats. It is different from angora rabbit fiber.","Lustrous, resilient and sometimes intentionally fuzzy.","Tailoring blends, airy knits, upholstery and pile fabrics.","Handle brushed surfaces gently. Follow the label, limit friction and avoid stretching wet knitwear.","Age and grade influence handle. Farm welfare, grazing practices and finishing are relevant sourcing questions.","Is the mohair origin documented, and does any certification cover this product?",["fao","standards"]],yak:["Yak down","Animal","A fine underlayer from the high plateau.","The fine insulating undercoat of yaks, separated from coarser outer hair.","Soft, warm and often used in natural brown tones.","Knitwear, scarves, blankets and wool blends.","Follow the label and treat fine down knits gently. Reshape and dry flat rather than hanging.","Collection methods, dehairing yield and herder compensation vary. Scarcity alone does not demonstrate responsible production.","Who collected the down, and how was it separated, graded and purchased?",["fao"]],angora:["Angora","Animal","Rabbit down with a distinctive halo.","Fine hair from Angora rabbits, often blended with other fibers for practical yarns.","Very fluffy, light and warm; can shed during wear.","Halo-effect knitwear, accessories and blended yarns.","Limit rubbing and follow the care label. Store folded; use gentle handling to preserve the surface.","Harvesting method and animal welfare are central. A country label does not establish humane handling.","Can the brand substantiate the farm conditions and collection method?",["fao"]],vicuna:["Vicu\xF1a","Animal","A rare Andean down with a complex provenance.","Fine undercoat from the wild vicu\xF1a, an Andean camelid.","Exceptionally fine handle; typically used in delicate luxury cloth.","Scarves, shawls, fine knitwear and coating.","Follow specialist care instructions. Protect from abrasion and store clean with suitable pest prevention.","Rarity increases the importance of documented origin, community benefit and lawful sourcing.","Can the seller provide origin and trade documentation appropriate to the specific product?",["fao","cites"]],camel:["Camel hair","Animal","Warmth gathered from a seasonal coat.","Fine down from the camel coat, separated from coarse hair; Bactrian camel is a familiar source.","Soft warmth and a characteristic natural tan palette.","Coats, knitwear, scarves and blankets.","Follow the label, brush coats gently and give garments time to air between wears.","Collection, dehairing and blending affect quality. The color name camel does not guarantee camel-fiber content.","Does the composition actually include camel hair, and in what proportion?",["fao"]],guanaco:["Guanaco","Animal","A Patagonian fiber with a conservation story.","Fine undercoat from the guanaco, a South American camelid.","Fine and warm, with a limited specialty market.","Fine scarves, knitwear and specialty cloth.","Follow specialist instructions; protect fine cloth from abrasion and moth damage.","Origin and collection require close scrutiny. The atlas retains geographic concepts without validating a commercial chain.","Is there independent documentation of the origin and collection method?",["fao","cites"]],qiviut:["Qiviut","Animal","An Arctic undercoat, patiently gathered.","The soft underwool of the musk ox, shed seasonally.","Light, soft and insulating, often used in small accessories.","Lace scarves, cowls, hats and hand-knitting yarn.","Follow the maker\u2019s directions. Treat lace structures gently and support the fabric when wet.","Farm-combed and other collection channels differ. Know the maker and the origin rather than relying on broad warmth claims.","Who gathered and processed the qiviut, and where was the piece made?",["qiviut"]],hemp:["Hemp","Plant","A strong stem fiber, made wearable.","Bast fiber from hemp stems; processing can retain long fibers or create shorter cottonized fibers.","Textured and firm in some fabrics, much softer in fine yarns or blends.","Shirting, denim blends, canvas and home textiles.","Follow the label. Wash with similar colors and avoid excessive drying heat.","Retting, separation and softening determine much of the processing burden. Hemp is not automatically chemical-free.","Was it mechanically processed or cottonized, and what share is actually hemp?",["flax","jute"]],jute:["Jute","Plant","The golden fiber of working textiles.","Bast fiber from Corchorus plants, separated from the stem.","Coarse and textured, suited to structure rather than soft next-to-skin use.","Sacking, rugs, cordage, geotextiles and composites.","Keep dry and follow item-specific guidance. Wet cleaning can distort or discolor some jute goods.","Retting water, mill conditions and product treatments influence the material\u2019s practical impact.","What is the intended lifetime, and are coatings or backing materials disclosed?",["jute"]],polyester:["Polyester","Synthetic","Engineered filaments, everywhere around us.","For most apparel, polyethylene terephthalate (PET), formed into continuous filament or staple fiber.","Versatile, low in moisture absorption and often quick to dry.","Sportswear, fleece, linings, home textiles and blends.","Follow the label, avoid unnecessary heat and wash only as needed. Reduce avoidable abrasion.","Virgin fossil feedstock, energy use and microfiber shedding are key considerations. Recycled content does not eliminate shedding.","What is the feedstock, recycled percentage and evidence for any recycling claim?",["exchange","standards"]],nylon:["Nylon","Synthetic","Strength designed into a filament.","A family of polyamides, commonly nylon 6 or nylon 6,6 in textiles.","Strong, smooth and abrasion-resistant, with properties that vary by polymer and yarn.","Hosiery, outerwear, swimwear, luggage and technical fabrics.","Follow the label and avoid high heat. Coatings and elastane blends may need special care.","Polymer type affects recycling options. Durability claims should be matched to the actual fabric and use.","Which polyamide is used, and is a realistic take-back or recycling route available?",["exchange"]],spandex:["Elastane","Synthetic","A little stretch changes the whole garment.","A segmented polyurethane fiber, also known as spandex, typically used in blends.","Highly extensible, adding recovery rather than bulk.","Stretch denim, sportswear, underwear and swimwear.","Avoid high heat unless permitted. Follow the label; chlorine, heat and time can reduce elastic recovery.","Small percentages can improve fit and wear but complicate separation and recycling of blended textiles.","How much elastane is necessary, and is recovery maintained through repeated use?",["exchange"]],acrylic:["Acrylic","Synthetic","A spun staple with a wool-like hand.","A synthetic fiber based primarily on acrylonitrile, usually spun into staple yarn.","Light and bulky, often with a soft, wool-like texture.","Sweaters, blankets, craft yarn and upholstery blends.","Follow the label. Avoid excess heat and handle pills carefully rather than pulling them off.","Fossil feedstock, process chemistry, pilling and synthetic-fiber shedding all merit consideration.","How does the fabric perform after washing, and what lifetime is expected?",["exchange"]],viscose:["Viscose","Cellulosic","Plant cellulose, dissolved and remade.","Regenerated cellulose made from dissolving pulp through the viscose process; often called rayon.","Absorbent with fluid drape; wet strength varies by fiber type.","Dresses, blouses, linings and knit blends.","Follow the label, support wet fabric and avoid wringing. Some garments require professional cleaning.","Wood sourcing and chemical recovery are separate questions. Plant feedstock does not make every process equivalent.","Can the supplier identify the pulp source and the fiber producer?",["lenzing"]],lyocell:["Lyocell","Cellulosic","Cellulose transformed through a solvent process.","Regenerated cellulose produced by direct solvent dissolution, distinct from the viscose process.","Smooth and absorbent, with drape shaped by yarn and finishing.","Shirting, denim blends, dresses and bedding.","Follow the care label and wash gently where allowed. Surface fibrillation can change the appearance of some fabrics.","Solvent recovery, energy supply and pulp origin differ among producers. Brand-specific claims should not be generalized.","Which producer made the fiber, and what recovery and forest-sourcing claims are verified?",["lenzing"]],modal:["Modal","Cellulosic","Regenerated cellulose with wet strength in mind.","A modified viscose-type cellulose fiber with improved wet mechanical properties.","Soft, absorbent and often used in smooth jersey.","Underwear, loungewear, T-shirts and bedding blends.","Use the label\u2019s wash and dry instructions. Support delicate knits and avoid unnecessary heat.","The process and wood supply need documentation. Modal is a generic fiber name, not one exclusive brand.","Which fiber producer and pulp sources stand behind the material?",["lenzing"]],ramie:["Ramie","Plant","An old bast fiber with a bright surface.","Bast fiber from Boehmeria nivea, a perennial plant also called China grass.","Lustrous and relatively crisp, often blended for handling and drape.","Summer shirts, woven textiles and blends.","Follow the label and reshape when damp. Blends and finishes determine suitable ironing and washing.","Separating and degumming the fiber is important to textile performance and processing impact.","How was the fiber degummed, and what other fibers are in the fabric?",["ramie"]],"recycled-wool":["Recycled wool","Recycled","Another life for an existing thread.","Wool recovered from production waste or used textiles, sorted and mechanically opened.","Varies with the input; often blended to balance shorter recovered fibers.","Coats, blankets, knitwear and felted products.","Care for the whole blend according to the label. Air between wears and repair small damage early.","Recovered fibers can be shorter. Input quality, blend share and new dyeing determine the result.","Is the input pre-consumer or post-consumer, and what percentage is recycled?",["standards","woolmark"]],"recycled-polyester":["Recycled polyester","Recycled","A new filament from an existing polymer.","PET reprocessed from sources such as bottles, industrial waste or textiles.","Can provide similar textile functions to virgin polyester; quality depends on feedstock and processing.","Fleece, sportswear, linings, bags and home textiles.","Follow the label, reduce avoidable heat and friction, and repair rather than replace where practical.","Bottle-to-fiber recycling is not the same as textile-to-textile recycling. Microfiber shedding remains relevant.","What waste stream supplied the PET, and is the recycled fraction independently verified?",["exchange","standards"]],mink:["Mink","Specialty","An archival view of a pelt-based material.","Mink is usually traded as a fur pelt, not as a conventional spun apparel fiber.","A dense underfur and visible guard-hair surface.","Fur garments, panels and trim.","Use a specialist familiar with the material and construction; avoid improvised washing.","Animal welfare and traceability are central. Original map connections are retained as unverified legacy concepts.","Can the seller document the species, provenance and handling at every stage?",["fao"]],fox:["Fox fur","Specialty","A pelt material with a pronounced pile.","Usually a fur pelt rather than a conventional textile fiber; species and product form need identification.","Long visible hairs over a denser underfur.","Fur panels, trim and specialty products.","Seek item-specific specialist care. Protect from heat and compression.","A geographic map cannot substantiate animal welfare or the origin of a pelt. Legacy connections remain unverified.","Is the exact species and supply chain disclosed with supporting records?",["fao"]],tanuki:["Raccoon dog fur","Specialty","A species name matters as much as a trade name.","Fur from a raccoon dog, sometimes sold under the name tanuki. It is not raccoon fiber.","A long-haired fur surface used as a pelt or trim.","Trim and fur products.","Use item-specific specialist care and avoid heat or improvised cleaning.","The legacy atlas\u2019s trade links have not been independently verified. Species identification and welfare evidence are essential.","Does the product disclose the species accurately and support the provenance claim?",["fao"]],yangir:["Yangir","Specialty","A rare trade name that needs careful evidence.","A specialty trade term associated with ibex down. Exact species and collection claims require supplier evidence.","Reported as a fine specialty down; no standardized performance ranking is asserted here.","Specialty luxury yarns and cloth.","Follow the maker\u2019s fiber-specific instructions and protect delicate cloth from abrasion.","Publicly verifiable route information is limited. Original Altai-to-Italy links are research leads, not established transactions.","What independently checkable evidence supports the species, collection and provenance?",["fao"]],cervelt:["Cervelt","Specialty","A proprietary name in the rare-fiber archive.","A trade name associated with red-deer down from New Zealand. Supplier-specific specifications require verification.","Marketed as a fine down; this atlas does not independently validate performance claims.","Specialty luxury knitwear and accessories.","Use the maker\u2019s instructions rather than assuming standard wool care applies.","The original geographic model is retained for context. Commercial volumes, current mills and performance need primary evidence.","Can the maker provide specifications and documented origin for this exact product?",["fao"]]},Ct=Object.fromEntries(Object.entries(Yn).map(([e,a])=>[e,{id:e,name:a[0],family:a[1],tagline:a[2],composition:a[3],feel:a[4],uses:a[5],care:a[6],tradeoff:a[7],question:a[8],sources:a[9],legacyOnly:a[1]==="Specialty"}])),qe=[{id:"read-the-label",tag:"START HERE",title:"A label is a beginning. Follow the rest of the story.",dek:"Five questions that take you beyond a fiber percentage.",time:4,fibers:["wool","cotton","viscose"],sources:["standards","sfa"],sections:[["Start with composition","Read every component, including linings and any elastane. A fabric called a wool coat can include a blend, a synthetic lining and interfacing. Record the stated percentages before comparing products."],["Separate origin from manufacture","The country where a garment was assembled may be different from the places where its fiber was grown, spun and woven. Ask for those stages separately. A mill name is useful only if you know what that mill actually did."],["Ask for evidence that matches the claim","A farm-level claim, a chemical-testing claim and a recycled-content claim answer different questions. Ask whether the claim applies to the specific product, and whether a current certificate or transaction record supports it."],["Look at the cloth in front of you","Handle, seams, weight, recovery and fit affect whether a garment will be worn for years. Fiber names can help frame questions; they cannot replace inspection of a finished piece."],["Use the care label as a design clue","A material may sound easy to wash while its lining, dye or finish demands something different. The whole garment\u2019s instructions should govern care."]]},{id:"natural-is-not-a-score",tag:"MATERIAL LITERACY",title:"Natural is an origin. It is not an impact score.",dek:"Make room for context when comparing what clothes are made of.",time:4,fibers:["linen","polyester","cashmere"],sources:["exchange","standards"],sections:[["Define the comparison","A kilogram of fiber, a square meter of fabric and a garment worn one hundred times are different comparison units. Before accepting an impact claim, find the functional unit, system boundary and assumptions."],["Look beyond the raw material","Farming, chemical processing, dyeing, energy supply, transport, laundering and disposal can all contribute. Two fabrics sharing a fiber name may have very different production histories."],["Keep distinct questions distinct","Animal welfare, worker conditions, greenhouse emissions, water stress and microfiber release are not interchangeable. A strong result on one measure does not settle the others."],["Prefer useful specificity","Ask for the growing region, processing plant, composition and expected lifetime. A modest, verifiable statement is more useful than an unexplained green score. This atlas deliberately avoids a single universal sustainability rating."]]},{id:"woollen-worsted",tag:"HOW IT IS MADE",title:"Two ways to turn wool into a world of cloth.",dek:"Woollen and worsted describe processing systems, not sheep breeds.",time:3,fibers:["wool","recycled-wool"],sources:["woolmark"],sections:[["Follow the preparation","Cleaned wool is opened and organized before yarn formation. In a worsted route, combing removes shorter fibers and helps align the longer ones. Woollen preparation retains a less parallel arrangement."],["Read the surface","Worsted yarns often make smooth, defined tailoring cloth. Woollen yarns can give a fuller, more textured fabric. Finishing can blur that distinction, so these are tendencies rather than promises."],["Put the vocabulary to work","When evaluating a sweater or jacket, ask about yarn preparation and construction as well as fiber content. A fine fiber does not automatically produce a durable or comfortable garment."]]},{id:"recycling-loop",tag:"CIRCULARITY",title:"Recycled from what? Destined for what?",dek:"The two questions behind a recycled-content claim.",time:4,fibers:["recycled-polyester","recycled-wool","spandex"],sources:["exchange","standards"],sections:[["Identify the input","Factory offcuts and worn garments are different waste streams. Bottle-derived polyester is another. Recycled content describes an input to the current product; it does not automatically establish a route for its next life."],["Distinguish recovery methods","Mechanical opening can shorten textile fibers. Polymer recycling follows a different path and has its own feedstock constraints. Color, contamination, blends and finishes affect both approaches."],["Read the percentage","A product may contain both recovered and virgin material. Look for a composition statement, the recycled fraction and evidence that applies to the specific product."],["Plan for the next owner","Repair, resale and continued use can keep a useful textile in service. A take-back program is meaningful when its actual sorting and downstream outlets are explained."]]},{id:"cellulose-family",tag:"FIBER FAMILIES",title:"Viscose, modal, lyocell: same family, different routes.",dek:"Why a wood-based origin is only the first part of the story.",time:3,fibers:["viscose","modal","lyocell"],sources:["lenzing"],sections:[["Begin with cellulose","These fibers are regenerated from cellulose. Unlike cotton or flax, the textile fiber is formed during industrial processing rather than simply extracted in its existing form."],["Follow the chemistry","Viscose uses a chemical conversion before regeneration. Modal modifies this general route to achieve particular properties. Lyocell uses direct solvent dissolution. Exact performance and recovery depend on the producer."],["Keep generic names and brands separate","Lyocell and modal are fiber types. A trademark can identify a producer\u2019s range, but a generic fiber label does not prove that the product came from that producer."],["Ask two questions","Where did the pulp originate, and how did the fiber plant manage its process? Both are necessary to assess a specific sourcing claim."]]},{id:"care-for-longer",tag:"USE & CARE",title:"The most interesting chapter happens after purchase.",dek:"A practical approach to caring for the clothes you already own.",time:3,fibers:["wool","silk","cotton"],sources:["woolmark"],sections:[["Follow the complete garment","Care instructions account for more than the main fiber. Dyes, trims, interfacing and blends can change what is appropriate. Start with the label and the maker\u2019s advice."],["Make cleaning intentional","Air garments when appropriate, deal with small marks promptly and wash when needed. Match the cleaning method to the item instead of applying one routine to everything."],["Support, dry, store","Wet knitwear may stretch under its own weight. Reshape pieces as directed, let them dry fully and store clean. Avoid excessive heat unless explicitly permitted."],["Repair while the problem is small","A loose button, open seam or thinning elbow is easier to address early. Good care does not guarantee permanence, but it gives a well-made garment more opportunities to be worn."]]},{id:"reading-the-map",tag:"ATLAS NOTES",title:"A line on a globe is a question worth asking.",dek:"How to read an illustrative supply chain without mistaking it for a shipment record.",time:3,fibers:["wool","linen","alpaca"],sources:["map"],sections:[["Places represent stages","A marker identifies a city or region associated with the atlas model. It does not pinpoint a farm, certify a mill or identify a contractual relationship."],["Lines show connections in a model","Curves connect stages for exploration. They are not vessel tracks, road itineraries, customs records or evidence that every batch travels that way. Shipping often involves ports and warehouses that are not drawn."],["Distance has a narrow meaning","The atlas estimates great-circle distance between the listed markers. It excludes real shipping detours and local collection legs. It is not a carbon calculation."],["Follow the evidence","Technical sources explain processes and material properties. Confirming an actual chain would require supplier records and product-level documentation. Specialty entries inherited from the old atlas are explicitly marked as unverified."]]},{id:"small-fibers",tag:"THE RARE-FIBER ARCHIVE",title:"Rarity deserves better questions.",dek:"How to approach specialty materials when the public evidence is thin.",time:3,fibers:["qiviut","vicuna","yangir"],sources:["qiviut","fao","cites"],sections:[["Know the name","A species, a fiber type and a proprietary trade name are different things. Ask which one appears on the product and whether the composition can be independently checked."],["Avoid the superlative trap","Claims such as warmest, rarest or softest require a defined comparison and a test method. The atlas removes unsupported rankings rather than turning marketing language into measurements."],["Find the people behind the material","Who collects it, how are they paid and what are the handling practices? A named, documented operation gives more useful context than a sweeping claim about a country."],["Treat gaps honestly","Some original map paths remain as research leads. They are marked as legacy concepts until evidence supports the specific relationship."]]}],La={"Bast fiber":"Fiber obtained from the stem tissues of plants such as flax, hemp and ramie.",Carding:"Opening and separating fibers into a web or strand before spinning.","Chain of custody":"A documented system for tracking a claimed material through successive organizations.",Combing:"Removing shorter fibers and aligning longer fibers before some spinning processes.",Cottonization:"Processing a bast fiber into shorter, finer elements suited to cotton-type equipment.",Dehairing:"Separating fine undercoat from coarser guard hair.",Denier:"A linear density unit: grams per 9,000 meters of yarn or fiber.",Drape:"How a fabric falls and folds under its own weight.",Dyeing:"Applying color to fiber, yarn, fabric or a finished garment.",Elastane:"A highly extensible synthetic fiber also known as spandex.",Filament:"A fiber of continuous or very long length, unlike a staple fiber.",Finishing:"Treatments after or around fabric formation that change appearance, feel or performance.",Ginning:"Separating cotton lint from seeds and other material.","Greasy wool":"Raw fleece before washing removes much of its grease and dirt.","Guard hair":"Coarser outer hair in an animal coat, distinct from a fine undercoat.",Hand:"The tactile feel of a textile, including softness, stiffness and surface character.",Knitting:"Making fabric by interlooping yarn.",Micron:"One micrometer. Often used to describe fiber diameter, but not a complete quality score.",Pilling:"The formation of small fiber balls on a fabric surface through wear and friction.","Post-consumer":"Material recovered after a product has been used by its end user.","Pre-consumer":"Material diverted from a manufacturing waste stream, subject to the applicable definition.","Regenerated cellulose":"Cellulose dissolved and formed again as a manufactured textile fiber.",Retting:"Breaking down the tissues that bind bast fibers to the stem, using an appropriate biological or processing route.",Scouring:"Cleaning raw fiber or textiles to remove unwanted grease, dirt or processing residues.",Scutching:"Mechanically separating retted flax fiber from woody stem fragments.",Sliver:"An untwisted strand of fibers prepared for further processing.",Staple:"A fiber of finite length, which can be natural or manufactured.",Top:"A prepared strand of combed fibers used in worsted-type processing.",Traceability:"The ability to follow material history through specified records and stages.","Warp & weft":"The lengthwise and crosswise yarn systems in a woven fabric.",Weaving:"Interlacing yarn systems to create fabric.",Worsted:"A yarn-processing route using prepared, aligned and typically combed fibers."},oa=[{id:"oceania",name:"Oceania",subtitle:"Pasture, fleece & first connections",countries:["Australia","New Zealand"],intro:"Start with the pastoral landscapes of Australia and New Zealand. The atlas links wool collection areas to processing hubs abroad, while the specialty archive keeps a separate record of the original deer-down concept.",question:"Which farm region, classing records and exporter connect the raw material to the mill?",color:"#a7b49a"},{id:"andes",name:"The Andes & Patagonia",subtitle:"Altitude, camelids & local knowledge",countries:["Peru","Bolivia","Chile","Argentina","Uruguay"],intro:"Alpaca, vicu\xF1a and guanaco bring very different collection and provenance questions. Arequipa is a focal point in the atlas\u2019s Andean textile model; southern wool origins add another set of connections.",question:"How are collection, sorting, community benefit and origin documented?",color:"#b78c6e"},{id:"east-asia",name:"East Asia",subtitle:"From herding country to industrial scale",countries:["China","Mongolia","South Korea","Japan"],intro:"The region spans pastoral origins, polymer production, spinning, weaving and retail. Similar geographic paths can carry entirely different material forms, from unprocessed down to finished garments.",question:"At each border, is the product raw fiber, top, yarn, fabric or a finished garment?",color:"#9fae91"},{id:"south-asia",name:"South Asia",subtitle:"Cotton, jute & the making of garments",countries:["India","Bangladesh","Nepal","Afghanistan"],intro:"Explore cotton spinning, jute processing, garment production and specialty wool routes. The atlas uses regional centers to make these stages legible without implying that all facilities share the same practices.",question:"Which specific spinning, wet-processing and garment facilities handled the order?",color:"#c5ae78"},{id:"europe",name:"Europe",subtitle:"Flax fields, mill towns & material science",countries:["Italy","France","Belgium","Lithuania","Austria","United Kingdom","Germany","Finland","Poland","Denmark","Greece","Turkey"],intro:"European nodes include flax cultivation, wool and silk textile districts, regenerated cellulose and recycled-wool processing. A European finishing location does not, by itself, describe the origin of the fiber.",question:"Which stages were performed locally, and which raw or intermediate materials were imported?",color:"#89a298"},{id:"africa",name:"Africa",subtitle:"Wool, mohair & cellulose feedstocks",countries:["South Africa","Lesotho","Mali"],intro:"The atlas connects southern African animal fibers with processing hubs and places West African cotton and southern African pulp into separate material stories. These are distinct industries with different evidence needs.",question:"What farm, collection and processing records accompany the material?",color:"#b69b7a"},{id:"americas",name:"North America & the Arctic",subtitle:"Cotton fields and northern underwool",countries:["United States","Canada","Greenland"],intro:"Cotton, technical fibers and qiviut sit far apart in both scale and geography. The model makes those contrasts visible while retaining the difference between a named producer example and a hypothetical downstream route.",question:"Is the geographic claim tied to a specific producer or only to a broad regional association?",color:"#a1abb3"},{id:"other-origins",name:"Other global connections",subtitle:"Pulp, feedstocks & markets",countries:["Brazil","Saudi Arabia","United Arab Emirates","Vietnam","Thailand","Indonesia"],intro:"Feedstocks and intermediate materials connect distant industries. Brazilian pulp, petrochemical inputs and Asian garment stages illustrate why the final place on a label tells only part of a textile story.",question:"What intermediate product is moving, and what evidence supports the proposed link?",color:"#b7a79a"}];var Vn="2026-09-22",ie=(e,a)=>({title:"CottonWorks: "+a,url:"https://cottonworks.com/encyclopedia-item/"+e+"/"}),Tt={card:ie("carding","Carding"),comb:ie("combing","Combing"),denier:ie("denier","Denier"),hand:ie("hand","Hand"),knit:ie("knitting","Knitting"),dye:ie("dyeing","Dyeing"),finish:ie("finishing","Finishing"),sliver:ie("sliver","Sliver"),staple:ie("staple-yarn","Staple yarn"),weave:ie("weaving","Weaving"),pill:ie("pilling","Pilling"),flax:{title:"Alliance for European Flax-Linen & Hemp: Flax growing and expertise",url:"https://allianceflaxlinenhemp.eu/en/flax-growing-expertise"},hemp:{title:"Alliance for European Flax-Linen & Hemp: Textile applications of hemp",url:"https://allianceflaxlinenhemp.eu/en/textile-applications-hemp"},flaxmap:{title:"Alliance: Mapping of processes for European flax-linen",url:"https://allianceflaxlinenhemp.eu/en/document_resources/13/download"},cashmere:{title:"Cashmere and Camel Hair Manufacturers Institute: Fiber definitions",url:"https://cashmere.org/definition-cashmere-wool.php"},scour:{title:"Woolmark: Scouring and carbonising",url:"https://www.woolmark.com/industry/product-development/wool-processing/woollen-scouring-carbonising/"},top:{title:"Woolmark: Worsted top-making",url:"https://www.woolmark.com/industry/product-development/wool-processing/worsted-top-making/"},wool:{title:"Woolmark: Wool processing",url:"https://www.woolmark.com/industry/use-wool/wool-processing/"},iwto:{title:"International Wool Textile Organisation: First-stage processing",url:"https://iwto.org/wool-supply-chain/first-stage-processing/"},micron:{title:"Woolmark: What is the wool fibre?",url:"https://www.woolmark.com/fibre/what-is-the-wool-fibre/"},pillcare:{title:"Woolmark: Pilling care factsheet",url:"https://www.woolmark.com/globalassets/_06-new-woolmark/_industry/certification/licensee-portal/gd5407-wool-care-factsheet_pilling.pdf"},lycra:{title:"The LYCRA Company: About LYCRA fiber",url:"https://one.lycra.com/en/lycra-frequently-asked-questions/about-lycra-fiber-website"},bisfa:{title:"BISFA: Terminology of man-made fibres (2017)",url:"https://bisfa.org/wp-content/uploads/2018/06/2017-BISFA-Terminology-final.pdf"},lenzing:{title:"Lenzing: Fiber production technologies",url:"https://www.lenzing.com/technology-production/technologies/"},gin:{title:"CottonWorks: Cotton growth, harvesting and ginning",url:"https://cottonworks.com/fiber/fiber-science/cotton-fiber-growth-harvesting-and-ginning/"},weavebasics:{title:"CottonWorks: Weaving basics",url:"https://cottonworks.com/learning-hub/weaving/weaving-basics/"},custody:{title:"Textile Exchange: Supply-chain certification",url:"https://textileexchange.org/get-certified/supply-chain/"},toolkit:{title:"Textile Exchange: Brand and retailer certification toolkit (2020)",url:"https://textileexchange.org/app/uploads/2022/11/TE-402-V1.0-Brand-and-Retailer-Certification-Toolkit.pdf"},policies:{title:"Textile Exchange: Standards policy and resource updates",url:"https://hub.textileexchange.org/home/site-wide-content/standards-policy-updates"},drape:{title:"NC State: Kawabata Evaluation System",url:"https://textiles.ncsu.edu/tpacc/comfort-performance/kawabata-evaluation-system/"},weights:{title:"Craft Yarn Council: Standard Yarn Weight System",url:"https://media.craftyarncouncil.com/standards/yarn-weight-system"}},_n=[["Bast fiber","Fiber structure","bast fibres, stem fiber","Bast describes where a fiber occurs in a plant. Flax and hemp provide bundles of strong supporting fibers in their stems. Processing separates those bundles from surrounding tissue and woody material before preparing them for yarn. A textile strand may still contain several associated cells, so a visible strand is not necessarily one elementary fiber.","A linen shirt starts with a stem-derived fiber; a cotton shirt starts with seed hairs. Both contain cellulose, but their extraction and preparation routes differ. This distinction helps explain why a flax journey includes retting and scutching while a cotton journey includes ginning.","Bast is a botanical category, not a guarantee of softness, organic cultivation or low impact. Ask which plant, preparation method and finished construction the description refers to.",["Retting","Scutching","Cottonization"],["flax","hemp"]],["Carding","Processing","carded, carded cotton","Carding opens a mass of fibers, separates tangles and produces a more manageable arrangement for later processing. Wire-covered surfaces help distribute the fibers; the output may be a web or a sliver, depending on the production system. Carding is a preparation step rather than the operation that makes a finished, twisted yarn.","Two cotton yarns can both be carded, while only one receives an additional combing step. On a mill specification, \u201Ccarded\u201D therefore describes preparation. It does not tell you the yarn count, twist, fabric weight or how the finished garment will feel after washing.","Do not treat carded as synonymous with low quality. The appropriate preparation depends on the intended yarn and fabric. Compare the actual finished textile and its performance requirements.",["Combing","Sliver","Worsted"],["card","wool"]],["Chain of custody","Claims & sourcing","CoC, certified supply chain","A chain-of-custody system connects a material claim to records and controls as goods pass between organizations. Under Textile Exchange certification, relevant supply-chain participants and transaction documentation help maintain the claimed material content through processing and trade. The exact rules depend on the standard and its current version.","Imagine a spinner buying certified recycled fiber. Evidence needs to connect the incoming material, processing records and outgoing yarn claim. A supplier\u2019s general certificate and documentation for a particular shipment answer different questions. Request evidence that matches the goods you are evaluating.","A certification logo is not a complete account of every environmental or labor issue. Read its scope. Chain of custody supports specified claims; it should not be expanded into unrelated guarantees.",["Traceability","Pre-consumer","Post-consumer"],["custody"]],["Combing","Processing","combed cotton, combed wool, noil","Combing selects and prepares a fiber population after earlier opening and carding. It removes shorter fibers and helps arrange the retained fibers for subsequent yarn production. In wool processing it also removes neps and residual vegetable matter. The shorter material removed during wool combing is called noil and may enter other textile routes.","A combed cotton shirt and a carded cotton shirt can share the same fiber composition but use different yarn preparation. Compare their surface, construction and washing behavior rather than assuming that the extra processing step determines every aspect of quality.","Combing is not the same as shearing or dehairing. It primarily prepares textile fibers for spinning; dehairing separates the coarse and fine components of certain animal coats.",["Carding","Top","Dehairing"],["comb","top"]],["Cottonization","Processing","cottonisation, cottonized hemp, cottonised flax","Cottonization adapts bast fibers to shorter-staple processing systems. The route can involve opening, shortening and refining fiber bundles, using mechanical and sometimes wet-processing steps. Its purpose is compatibility with equipment and blends, rather than changing the plant species or turning hemp or flax into cotton.","A spinner might blend cottonized hemp with cotton to use an established short-staple production line. The resulting yarn still contains hemp. The blend ratio, remaining bundle size and processing conditions help determine its suitability for the planned fabric.","Cottonized is a process description, not a fiber-content claim. It also differs from regenerated cellulose, where cellulose is dissolved and formed into a new fiber. Ask for the actual composition and preparation route.",["Bast fiber","Staple","Regenerated cellulose"],["hemp","flaxmap"]],["Dehairing","Processing","dehaired, undercoat separation","Dehairing separates the fine undercoat sought for textiles from the coarser outer hairs present in some animal fleeces. Cashmere is associated with the fine, dehaired undercoat of the cashmere goat. Separation matters because an average description of a fleece can conceal very different fiber populations.","When discussing a cashmere lot, ask whether measurements describe the raw mixed fleece or the prepared textile fiber. A soft-looking photograph cannot establish how effectively coarse hairs were removed. Composition and diameter information provide different pieces of evidence.","Dehairing is not simply another name for washing, nor does it mean that every remaining fiber has an identical diameter. Avoid judging finished comfort from a process name alone; yarn construction and surface finishing also matter.",["Guard hair","Micron","Scouring"],["cashmere"]],["Denier","Measurements","den, D, linear density","Denier measures mass per length: a 9,000-meter length with a mass of 1 gram is 1 denier. A larger number means more mass for the same length. The unit may describe an individual filament or a whole yarn, so the object being measured must accompany the number.","A 90-denier yarn has a linear density of 10 tex because tex uses grams per 1,000 meters. If that yarn contains 30 equal filaments, each is nominally 3 denier. These are calculated examples, not measurements of a particular fabric.","Denier is not a direct diameter, thread count or fabric-weight measurement. Material density, cross-sectional shape, filament count and fabric construction prevent a simple universal conversion from denier to softness, opacity or durability.",["Filament","Micron","Staple"],["denier"]],["Drape","Fabric performance","drapability, fabric fall","Drape describes the folds and silhouette a fabric forms when supported at some points and allowed to hang elsewhere. Its behavior reflects several interacting properties, including bending resistance, deformation between yarns and its own weight. Drape is experienced at the fabric level, so composition alone is an incomplete description.","Compare two equally sized swatches over the same rounded support. One may form broad, structured folds while the other falls into smaller folds. That comparison helps a maker choose between a sculptural jacket and a flowing skirt without treating either result as universally better.","Drape and hand are related but different observations: one concerns hanging behavior, the other touch. A fabric can feel soft in the hand yet retain a relatively structured silhouette. Evaluate a representative finished sample.",["Hand","Weaving","Finishing"],["drape","hand"]],["Dyeing","Color & finishing","dyed, yarn-dyed, piece-dyed, garment-dyed","Dyeing introduces color to a textile substrate. It can take place at the fiber, yarn, fabric or garment stage, and the choice affects production planning and the appearance that can be created. Fiber chemistry and the intended color determine which dye systems and processing conditions are suitable.","A yarn-dyed stripe can be built by arranging differently colored yarns before fabric formation. A piece-dyed fabric is colored after the cloth has been formed. These examples explain the processing stage, but do not establish the product\u2019s resistance to washing or rubbing.","Color application and colorfastness are different questions. \u201CDyed\u201D does not promise permanence under every exposure. Request test information appropriate to the intended use, and follow the finished garment\u2019s care instructions.",["Finishing","Scouring","Warp & weft"],["dye","weavebasics"]],["Elastane","Fiber structure","spandex, LYCRA, stretch fiber","Elastane and spandex are generic names for the same class of highly extensible manufactured fiber. LYCRA is a brand name associated with this category, not the generic name of every stretch textile. The fiber is commonly incorporated with other materials so a fabric can extend and recover during use.","A cotton garment containing a small amount of elastane may stretch differently from an all-cotton garment. The percentage alone is insufficient to predict the result: the placement of the stretch yarn and the knitted or woven structure also need consideration.","A fabric can stretch through its construction without containing elastane. Conversely, an elastane percentage does not specify how much stretch occurs in each direction or how well the garment recovers. Check composition and finished-fabric behavior separately.",["Knitting","Weaving","Filament"],["lycra","bisfa"]],["Filament","Fiber structure","continuous filament, monofilament, multifilament","A filament is a very long fiber that can be used continuously rather than assembled from many short lengths. A monofilament yarn uses one filament; a multifilament yarn brings several together. Manufactured filaments may also be cut into finite lengths for staple-fiber processing.","Think of a continuous strand compared with a rope assembled from overlapping short pieces. Both can become useful yarns, but their construction differs. A yarn specification should identify whether a denier value refers to the complete multifilament yarn or to each filament.","Filament does not mean synthetic, and staple does not mean natural. Reeled silk provides a natural filament example. The words describe length and construction, while the fiber name describes material identity.",["Staple","Denier","Sliver"],["bisfa","staple"]],["Finishing","Color & finishing","finish, mechanical finishing, chemical finishing","Finishing changes textile appearance, touch or performance beyond its basic construction and coloration. Processes may act mechanically or use chemical treatments. Despite the name, finishing is not always the final operation in a manufacturing sequence. Its effects should be evaluated on the actual finished textile.","If two fabrics share the same composition and weave but have different surfaces, a finishing difference may help explain the result. Ask what treatment was applied, what property it is intended to change, and whether that property was measured after repeated care cycles.","A finish can alter the impression created by the underlying fiber. Initial softness or smoothness alone cannot identify the fiber or establish long-term performance. Avoid assuming that a treatment\u2019s presence tells you its durability.",["Hand","Drape","Dyeing"],["finish"]],["Ginning","Processing","cotton gin, lint, seed cotton","Ginning separates cotton lint from seeds after harvesting. Cleaning operations remove additional unwanted material, and the prepared lint is compressed into bales for transport and later textile production. This is an early agricultural-processing stage, before a spinning mill turns the fiber into yarn.","In a cotton supply-chain record, distinguish seed cotton arriving at a gin from a lint bale leaving it. Those are different material forms. Keeping the stage clear makes it easier to interpret quantities and to understand why incoming and outgoing masses are not interchangeable.","Ginning does not mean spinning, combing or fabric washing. Nor does the gin\u2019s location automatically identify the farm for every bale. An origin claim needs records that connect the relevant stages.",["Carding","Staple","Traceability"],["gin"]],["Greasy wool","Processing","raw wool, fleece, wool grease","Greasy wool is wool before raw-wool scouring removes much of its grease and accompanying contaminants. A raw fleece contains more than clean textile fiber: dirt, dust and suint, among other material, contribute to its mass. The amount varies with the fleece and its circumstances.","If comparing a raw fleece price with a clean-fiber price, first identify the mass basis. A kilogram of greasy wool is not equivalent to a kilogram of scoured fiber. Ask whether a quoted quantity or yield refers to the material before or after cleaning.","Greasy describes a processing state, not a wool breed or a softness grade. It also does not establish how the wool will perform once cleaned, spun, constructed and finished.",["Scouring","Carding","Worsted"],["scour"]],["Guard hair","Fiber structure","outer coat, coarse hair, underdown","Guard hair refers to the coarser outer component of a coat where it is distinguished from a finer undercoat. The distinction is especially useful when discussing cashmere preparation. The mixed raw coat and the selected fine textile fraction should not be treated as the same material specification.","For a fine animal-fiber purchase, ask whether the sample represents the raw coat or the dehaired product. A supplier\u2019s fiber-diameter data should be interpreted alongside that description. A single average may not communicate the entire distribution of fine and coarse fibers.","Guard hair is not a synonym for all animal hair, and the term alone does not identify an animal species. Its relevance depends on the coat and the intended product.",["Dehairing","Micron","Hand"],["cashmere"]],["Hand","Fabric performance","handle, fabric feel, tactile properties","Hand, also called handle, is the tactile impression a textile gives when touched or manipulated. Useful descriptions identify specific qualities such as softness, stiffness, smoothness or surface roughness. The word gathers several sensations rather than naming one universal numerical property.","Compare swatches with the same handling action: stroke the surface, gently bend them and compress them. Record what you notice separately. \u201CSmooth surface but firm body\u201D is more informative to another maker than an unexplained claim of \u201Cexcellent hand.\u201D","Hand depends on the finished textile, not just its fiber label. Personal preference, fabric structure and finishing can change the assessment. A pleasant initial feel also does not prove durability or suitability for every skin-contact use.",["Drape","Finishing","Micron"],["hand"]],["Knitting","Fabric construction","knit, loops, weft knitting, warp knitting","Knitting forms fabric through connected yarn loops. Loop geometry distinguishes it from weaving, where yarn systems interlace. Weft and warp knitting arrange and supply yarns differently, and the resulting structures offer a wide range of surface patterns and mechanical behavior.","Look closely at a simple jersey fabric: its repeated loops explain why the material can deform in ways a tightly woven fabric may not. That does not mean every knit stretches equally. Yarn choice, loop dimensions and structure all influence the finished result.","Knit describes construction rather than composition. Cotton, wool and manufactured fibers can all be knitted. Do not assume that a knit contains elastane or that every knitted garment has the same care needs.",["Weaving","Elastane","Hand"],["knit"]],["Micron","Measurements","micrometer, micrometre, \xB5m, \u03BCm, fiber diameter","A micron is one micrometer, equal to one millionth of a meter. It is commonly used for wool fiber diameter. A stated mean diameter summarizes a population of fibers rather than asserting that every fiber in the sample measures exactly that amount.","For scale, 20 microns equals 0.020 millimeters. If comparing two wool lots, ask whether their numbers were measured on comparable samples and whether information about variability accompanies the average. This makes the comparison more useful than reading the number as a product grade.","Diameter is different from fiber length, yarn linear density and fabric weight. A lower mean diameter alone cannot describe strength, pilling, origin or the performance of a completed garment.",["Denier","Guard hair","Staple"],["micron"]],["Pilling","Fabric performance","pills, bobbling, fabric pills","Pilling is the development of small entangled balls of fiber on a fabric surface. Wear and rubbing can bring fibers together into these visible clusters. High-contact regions, such as areas rubbed by sleeves or bags, may look different from less-exposed parts of the same garment.","When assessing a sweater, compare a frequently rubbed area with a protected area. Record the exposure and care history before drawing conclusions. A laboratory pilling result is also meaningful only with its method and test conditions; it is not a guarantee for every wearer.","Pills are not the same as loose lint, and pilling alone does not identify fiber composition. Follow garment care guidance and use any removal method cautiously to avoid damaging the underlying fabric.",["Staple","Hand","Finishing"],["pill","pillcare"]],["Post-consumer","Claims & sourcing","post-consumer recycled, PCR","Post-consumer material comes from products that have reached an end user and are recovered after their intended use. In a recycled-content claim, the term describes the source stage of the input. It does not by itself specify whether the input was a textile, packaging or another product.","A used garment collected for fiber recovery and a used plastic bottle processed into a textile feedstock have different original forms. Ask which input a claim refers to, what proportion of the final material it represents, and how that proportion is documented.","Recycled input does not automatically mean the finished product can be recycled again in your local system. The applicable certification definition and evidence should accompany a specific commercial claim.",["Pre-consumer","Chain of custody","Traceability"],["toolkit"]],["Pre-consumer","Claims & sourcing","post-industrial, manufacturing waste","Pre-consumer material is recovered from manufacturing before a product reaches its end user. Eligibility for a recycled-content claim depends on the applicable definition. Rework or scrap returned within its originating process may be treated differently from material diverted from a separate waste stream.","For cutting-room offcuts, ask where they were generated, how they were collected and what recycling operation transformed them. The example describes a possible input stream; it does not certify the eligibility of every offcut under every scheme.","The rules can change. Textile Exchange published 2026 updates concerning reclaimed-material tracking and an alternative definition for certain pre-consumer plastics. Check the effective standard and claim scope instead of treating an older general definition as a current certification decision.",["Post-consumer","Traceability","Chain of custody"],["toolkit","policies"]],["Regenerated cellulose","Fiber structure","regenerated cellulosic, rayon, viscose, lyocell, modal","Regenerated cellulose fibers are manufactured by dissolving cellulose and forming it again as fiber. Viscose, modal and lyocell belong to this broader family, but their processes differ. Lenzing describes direct dissolution for lyocell and a chemical derivatization step before dissolution in its viscose route.","The source of the cellulose and the name of the resulting fiber answer different questions. A wood or other plant feedstock does not mean the final fiber was mechanically extracted intact from that plant. Ask for both the generic fiber name and its feedstock information.","Regenerated is not synonymous with recycled: the cellulose may originate from virgin or recovered inputs. A renewable feedstock also does not establish the environmental performance of the full production process.",["Bast fiber","Cottonization","Filament"],["lenzing"]],["Retting","Processing","dew retting, field retting, water retting","Retting loosens the tissues that bind useful bast fibers within a plant stem. European flax production commonly uses field retting, where natural conditions and biological action help make the fibers separable. The process prepares stems for mechanical extraction rather than producing finished yarn.","A flax journey may show pulling, retting and then scutching. Read those as distinct transformations: harvesting the stem, loosening binding tissues and separating the usable fiber from woody material. Keeping them separate makes processing descriptions easier to follow.","Retting practices depend on crop and production route. Do not assume that every bast fiber is water-retted or that a process name establishes its water, energy or pollution impacts.",["Bast fiber","Scutching","Cottonization"],["flax"]],["Scouring","Processing","washed wool, raw wool scouring, textile cleaning","Scouring is a cleaning operation whose specific purpose depends on the substrate. In raw wool, washing and rinsing remove grease and contaminants before later processing. This prepares a more usable fiber mass; it is different from aligning fibers or selecting a length distribution.","A wool mill can receive greasy fleece and supply scoured loose wool before another facility performs top-making. The words \u201Cscoured\u201D and \u201Ccombed\u201D therefore describe separate changes. Ask which material form is actually being supplied before comparing prices or quantities.","Industrial scouring is not a home-care instruction. A finished garment may include dyes, finishes, lining and construction that require a particular wash or cleaning method. Follow the product\u2019s label.",["Greasy wool","Carding","Top"],["wool","scour"]],["Scutching","Processing","scutched flax, shives, flax extraction","Scutching mechanically separates useful flax fibers from the woody portions of retted stems. It belongs to fiber extraction, before yarn spinning. The process produces useful fiber fractions and other outputs rather than converting the entire stem into a single textile material.","A lot described as scutched flax is at a different stage from spun linen yarn. If comparing material offers, ask which preparation stages still remain and whether the material is a long-fiber or shorter-fiber fraction. These distinctions matter for the planned processing route.","Scutching is not the same as retting: retting loosens tissues, while scutching carries out mechanical separation. It is also not a synonym for cotton ginning, which separates seed hairs from seeds.",["Retting","Bast fiber","Ginning"],["flax","flaxmap"]],["Sliver","Processing","card sliver, drawn sliver, fiber strand","A sliver is a continuous, largely untwisted strand made from many individual fibers. It is an intermediate form that makes a loose fiber mass easier to handle, combine and draw during preparation for spinning. Its continuity does not imply that its constituent fibers are continuous filaments.","A card may deliver a strand of short cotton fibers as sliver. Later operations can combine or draw such strands before yarn formation. Imagine overlapping short pieces arranged into a continuous ribbon: the ribbon is continuous even though each piece ends.","Sliver and finished yarn should not be used interchangeably. A sliver has not acquired the same structure or handling strength as the yarn ultimately made from it. Specify the processing stage when discussing a sample.",["Carding","Top","Staple"],["sliver","wool"]],["Staple","Fiber structure","staple fiber, staple fibre, cut staple, staple length","Staple fibers have finite lengths and are assembled into yarn through overlap and an appropriate spinning process. Cotton and wool are familiar natural examples; manufactured fibers can also be cut to staple lengths. The length distribution matters, not just the longest fiber in a sample.","A polyester textile can use continuous-filament yarn or spun yarn made from cut polyester staple. The polymer name can therefore remain the same while the yarn construction changes. Ask for the fiber form when a composition label does not explain the texture you observe.","Staple is not a quality rating or a synonym for natural fiber. \u201CLong staple\u201D needs context: relevant lengths and processing expectations differ between cotton, wool and other fiber systems.",["Filament","Combing","Sliver"],["staple"]],["Top","Processing","wool top, combed top, top-making","Top is the prepared, combed strand used in the worsted wool route. Top-making brings together preparation stages that improve alignment and remove short fibers and remaining contaminants. The resulting strand is an intermediate material that will be further processed before becoming yarn.","A top supplier and a yarn spinner may be separate businesses. An order for wool top therefore does not necessarily include spinning. When following a material journey, identify the stage where a prepared fiber strand becomes a specified yarn.","Top is not the same as loose scoured wool or finished worsted cloth. It is also not a universal name for every carded strand. Ask whether the material is card sliver, combed top, roving or spun yarn.",["Combing","Sliver","Worsted"],["top"]],["Traceability","Claims & sourcing","provenance, origin records, supply-chain tracking","Traceability is the ability to follow specified information about a material through recorded stages. A useful claim identifies what is traced, how far back the records reach and which links are supported. A map of plausible locations is not, by itself, a record for a specific product.","For a garment, you might know the sewing factory but not the spinning mill or fiber origin. State that boundary clearly. To investigate further, ask for links between the product, batch records, purchases and the relevant upstream facilities.","Traceability and certification are different ideas. A traceable material is not automatically certified to an environmental standard, and a general supplier certificate does not answer every product-origin question. Fibers of Earth routes remain illustrative.",["Chain of custody","Ginning","Post-consumer"],["custody"]],["Warp & weft","Fabric construction","warp and weft, ends, picks, filling, selvedge, selvage","Warp and weft are the principal yarn systems in weaving. Warp yarns run lengthwise through the loom, while weft, also called filling, crosses them. The sequence of interlacing produces the weave, and the two systems may use different yarns, colors or materials.","On a woven sample with its original selvedge, the warp direction runs along that edge. Identify both directions before comparing stretch or cutting a pattern piece. A fabric can behave differently lengthwise and crosswise even when its overall composition is unchanged.","These are structural directions, not fiber names. The terminology also should not be applied casually to the loop rows and columns of ordinary weft knitting, which uses a different construction.",["Weaving","Knitting","Dyeing"],["weavebasics"]],["Weaving","Fabric construction","woven fabric, loom, interlacing","Weaving constructs fabric by interlacing yarn systems. In a conventional loom, warp yarns are arranged lengthwise and weft is inserted across them. Different interlacing sequences produce structures such as plain weave, twill and satin; those structures are not themselves fiber types.","Two fabrics can both be cotton while one uses a plain weave and the other a twill. A composition label identifies the material, while a construction description helps explain its surface and behavior. Both are needed to describe the textile usefully.","Woven does not automatically mean rigid, waterproof or non-stretch. Yarn selection, interlacing, density and finishing influence the final performance. Compare finished samples for the use you have in mind.",["Warp & weft","Knitting","Drape"],["weave"]],["Worsted","Processing","worsted-spun, worsted wool, woollen, woolen","In textile manufacturing, worsted describes a preparation and spinning route using aligned, combed fibers. It contrasts with the woollen route, which uses a different preparation sequence. The processing distinction helps explain yarn character, but does not by itself prescribe a particular garment or weave.","A worsted yarn can be used in different fabric constructions. When reading a supplier\u2019s description, separate the processing route from fiber composition, yarn count and the eventual knitted or woven structure. That prevents one familiar word from standing in for a complete specification.","Hand-knitting labels also use \u201Cworsted weight\u201D as a yarn-size category. That usage does not establish that the yarn was manufactured by the worsted wool-processing route. Confirm which meaning the speaker intends.",["Top","Combing","Carding"],["iwto","top","weights"]]],we=_n.map(([e,a,t,n,i,r,o,s])=>({id:e.toLowerCase().replace(/ & /g,"-and-").replace(/[^a-z0-9]+/g,"-"),term:e,category:a,aliases:t.split(", "),definition:La[e],explanation:n,example:i,caution:r,related:o,sources:s,reviewed:Vn})),Mt=Object.fromEntries(we.map(e=>[e.id,e])),Rt=[...new Set(we.map(e=>e.category))].sort(),$t=e=>e.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();function qa({q:e="",category:a="",letter:t=""}={}){return we.filter(n=>(!a||n.category===a)&&(!t||n.term[0]===t)&&$t([n.term,...n.aliases,n.definition,n.explanation,n.example,n.caution].join(" ")).includes($t(e))).sort((n,i)=>n.term.localeCompare(i.term,"en"))}var Jn=e=>String(e??"").replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[a]);function It(e,a=t=>"#/glossary/"+t){let t=Jn;return`<p class="definition-lead">${t(e.definition)}</p><section><h2>In detail</h2><p>${t(e.explanation)}</p></section><section><h2>A practical example</h2><p>${t(e.example)}</p></section><section><h2>What to distinguish</h2><p>${t(e.caution)}</p></section><section><h2>Related terms</h2><ul class="related-terms">${e.related.map(n=>{let i=we.find
